name: Telegram notify
description: Send a Telegram notification with the workflow status and timestamp

inputs:
  bot_token:
    description: Token of the Telegram bot
    required: true
  chat_id:
    description: ID of the target Telegram chat/channel
    required: true
  status:
    description: Success or failure
    required: true

runs:
  using: composite
  steps:
    - name: Send Telegram message
      shell: bash
      env:
        STATUS: ${{ inputs.status }}
        REF_NAME: ${{ github.ref_name }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        WORKFLOW: ${{ github.workflow }}
        REPOSITORY: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        BOT_TOKEN: ${{ inputs.bot_token }}
        CHAT_ID: ${{ inputs.chat_id }}
      run: |
        if [[ "$STATUS" == "success" ]]; then
          emoji="✅"
        else
          emoji="❌"
        fi

        branches_action=""
        if [[ "$HEAD_REF" == "" ]]; then
          branches_action="to \`$REF_NAME\`"
        else
          branches_action="to \`$BASE_REF\`%0Afrom \`$HEAD_REF\`"
        fi

        timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        message="${emoji} *workflow:* \`$WORKFLOW\`%0A*$STATUS* on $REPOSITORY%0A${timestamp}%0A*action:* \`$EVENT_NAME\`%0A${branches_action}"

        curl -s -X POST \
          "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
          -d "chat_id=$CHAT_ID" \
          -d "text=${message}" \
          -d "parse_mode=Markdown"